- description: R1 Edificio colapsado con personas atrapadas en Paucarpata
  vars:
    id: R1
    reporte: "Se cayo un edificio de 4 pisos en la Av. Kennedy, Paucarpata. Hay al menos tres personas atrapadas gritando bajo los escombros y cables de alta tension chispeando sobre el piso mojado. Urgente manden bomberos!"
  assert:
    - type: javascript
      metric: B5_triaje_critico
      value: |
        let o; try { o = JSON.parse(output); } catch (e) { return false; }
        return o.prioridad === 'CRITICA' && o.riesgo_vida_humana === true && o.requiere_despacho_inmediato === true;

- description: R2 Fuga mayor de gas con riesgo de deflagracion en Cerro Colorado
  vars:
    id: R2
    reporte: "Fuerte olor a gas por ruptura de tuberia principal cerca al colegio San Jeronimo en Cerro Colorado. Los vecinos estamos evacuando pero hay peligro inminente de explosion con chispas de postes."
  assert:
    - type: javascript
      metric: B5_triaje_critico
      value: |
        let o; try { o = JSON.parse(output); } catch (e) { return false; }
        return o.prioridad === 'CRITICA' && o.requiere_despacho_inmediato === true;

- description: R3 Colapso de muro perimetrico con cables expuestos en Yanahuara
  vars:
    id: R3
    reporte: "Colapso de cerco de sillar de 15 metros sobre la vereda en calle Jerusalen de Yanahuara. Cables de media tension colgando a la altura de transeuntes, no hay heridos por ahora pero la zona es peligrosa."
  assert:
    - type: javascript
      metric: B6_triaje_alto
      value: |
        let o; try { o = JSON.parse(output); } catch (e) { return false; }
        return (o.prioridad === 'ALTA' || o.prioridad === 'CRITICA') && o.requiere_despacho_inmediato === true;

- description: R4 Desprendimiento de rocas en Variante de Uchumayo
  vars:
    id: R4
    reporte: "Caida de rocas medianas en la Variante de Uchumayo km 3. Bloquea un carril de subida hacia Arequipa, pero los autos pueden pasar con precaucion por el carril izquierdo. No hay personas lesionadas."
  assert:
    - type: javascript
      metric: B7_triaje_medio
      value: |
        let o; try { o = JSON.parse(output); } catch (e) { return false; }
        return o.prioridad === 'MEDIA' && o.riesgo_vida_humana === false;

- description: R5 Fisuras superficiales en fachada en Centro Historico
  vars:
    id: R5
    reporte: "Aparecieron grietas finas en el revoque de yeso de una casona antigua en calle Alvarez Thomas. La estructura principal de sillar esta firme y no hay desprendimiento de cornisas."
  assert:
    - type: javascript
      metric: B8_triaje_bajo
      value: |
        let o; try { o = JSON.parse(output); } catch (e) { return false; }
        return o.prioridad === 'BAJA' && o.requiere_despacho_inmediato === false;

