    reporte: "Por el movimiento sismico se revento una matriz de agua en Av. Cayma cuadra 4. Se esta inundando la calzada y varios autos estan desviandose. No hay atrapados ni derrumbes."
  assert:
    - type: javascript
      metric: B7_triaje_medio
      value: |
        let o; try { o = JSON.parse(output); } catch (e) { return false; }
