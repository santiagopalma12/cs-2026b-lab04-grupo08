name: fitness-functions

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  arquitectura:
    name: Verificación de Fitness Functions Arquitecturales (Lab 08)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias de validación arquitectural
        run: |
          python -m pip install --upgrade pip
          pip install import-linter pytest matplotlib numpy

      - name: Verificar contratos estructurales (FF-01 y FF-02)
        run: |
          PYTHONPATH=src lint-imports

      - name: Ejecutar fitness functions de calidad (FF-03 a FF-06)
        run: |
          PYTHONPATH=src:. pytest -v tests/test_fitness.py
